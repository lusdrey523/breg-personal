<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B2FC9"/>
      <stop offset="50%" style="stop-color:#3B4FE8"/>
      <stop offset="100%" style="stop-color:#00C8F8"/>
    </linearGradient>
    <linearGradient id="b-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B2FC9;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#1a3aff;stop-opacity:0.9"/>
    </linearGradient>
    <!-- Patrón andino de rombos -->
    <pattern id="andean" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <!-- Rombo central -->
      <polygon points="20,5 35,20 20,35 5,20" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
      <polygon points="20,12 28,20 20,28 12,20" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <rect x="18" y="18" width="4" height="4" fill="rgba(255,255,255,0.12)" transform="rotate(45 20 20)"/>
      <!-- Esquinas -->
      <polygon points="0,0 8,0 0,8" fill="rgba(255,255,255,0.06)"/>
      <polygon points="40,0 32,0 40,8" fill="rgba(255,255,255,0.06)"/>
      <polygon points="0,40 8,40 0,32" fill="rgba(255,255,255,0.06)"/>
      <polygon points="40,40 32,40 40,32" fill="rgba(255,255,255,0.06)"/>
    </pattern>
    <clipPath id="b-clip">
      <path d="M 90 60 L 90 452 L 280 452 C 380 452 430 400 430 330 C 430 280 400 245 355 230 C 395 215 415 180 415 135 C 415 80 370 60 280 60 Z M 165 115 L 265 115 C 310 115 335 135 335 168 C 335 200 310 222 265 222 L 165 222 Z M 165 278 L 275 278 C 325 278 355 300 355 340 C 355 378 325 398 275 398 L 165 398 Z"/>
    </clipPath>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fondo redondeado (app icon) -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>

  <!-- Patrón andino sobre fondo -->
  <rect width="512" height="512" rx="112" fill="url(#andean)"/>

  <!-- Sombra/profundidad de la B -->
  <path d="M 95 65 L 95 457 L 285 457 C 385 457 435 405 435 335 C 435 285 405 250 360 235 C 400 220 420 185 420 140 C 420 85 375 65 285 65 Z" fill="rgba(0,0,0,0.3)" transform="translate(4,4)"/>

  <!-- Cuerpo de la B con gradiente -->
  <path d="M 90 60 L 90 452 L 280 452 C 380 452 430 400 430 330 C 430 280 400 245 355 230 C 395 215 415 180 415 135 C 415 80 370 60 280 60 Z M 165 115 L 265 115 C 310 115 335 135 335 168 C 335 200 310 222 265 222 L 165 222 Z M 165 278 L 275 278 C 325 278 355 300 355 340 C 355 378 325 398 275 398 L 165 398 Z" fill="url(#b-grad)" filter="url(#glow)"/>

  <!-- Patrón andino dentro de la B -->
  <rect width="512" height="512" rx="0" fill="url(#andean)" clip-path="url(#b-clip)" opacity="0.6"/>

  <!-- Highlight/borde de la B -->
  <path d="M 90 60 L 90 452 L 280 452 C 380 452 430 400 430 330 C 430 280 400 245 355 230 C 395 215 415 180 415 135 C 415 80 370 60 280 60 Z M 165 115 L 265 115 C 310 115 335 135 335 168 C 335 200 310 222 265 222 L 165 222 Z M 165 278 L 275 278 C 325 278 355 300 355 340 C 355 378 325 398 275 398 L 165 398 Z" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

  <!-- Destellos del ícono original -->
  <ellipse cx="150" cy="100" rx="60" ry="20" fill="rgba(255,255,255,0.1)" transform="rotate(-30 150 100)"/>
</svg>
